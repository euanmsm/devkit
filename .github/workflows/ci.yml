name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # The release pull request consumes every changeset, so by the time it
      # exists there are none left to find. Checking it would deadlock releases.
      - name: Every changed package has a changeset
        if: github.head_ref != 'changeset-release/main'
        run: npx changeset status --since=origin/main
